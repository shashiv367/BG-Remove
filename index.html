<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background Remover</title>
    <meta name="description" content="Remove image backgrounds instantly in your browser. No uploads, fully private.">
<style>
* { box-sizing: border-box; }

:root {
    --beige: #efe2cf;
    --beige-light: #f8f1e7;
    --brown: #6f4e37;
    --brown-dark: #4e3524;
    --brown-light: #9a7657;
    --border: #d2bda4;
    --white: #fffaf3;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--beige);
    color: var(--brown-dark);
    min-height: 100vh;
}

.app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
}

.content {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 0;
}

/* Upload box */
#drop-zone {
    background: var(--beige-light);
    border: 2px dashed var(--brown-light);
    border-radius: 8px;
    padding: 55px 25px;
    text-align: center;
    cursor: pointer;
    transition: .2s ease;
}

#drop-zone:hover,
#drop-zone.dragover {
    border-color: var(--brown);
    background: var(--white);
}

#drop-zone h2 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
    color: var(--brown-dark);
}

#drop-zone .hint {
    margin: 0 0 20px;
    font-size: 14px;
    color: var(--brown-light);
}

.upload-actions {
    display: flex;
    justify-content: center;
}

.btn-browse {
    padding: 10px 22px;
    border: 0;
    border-radius: 5px;
    background: var(--brown);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}

.btn-browse:hover {
    background: var(--brown-dark);
}

#file-input {
    display: none;
}

/* Preview */
.preview-section {
    display: none;
    margin-top: 20px;
}

.preview-container {
    background: var(--beige-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    border-bottom: 1px solid var(--border);
}

.file-details h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
}

.btn-change {
    padding: 6px 12px;
    border: 1px solid var(--brown-light);
    border-radius: 4px;
    background: transparent;
    color: var(--brown);
    cursor: pointer;
    font-size: 13px;
}

.btn-change:hover {
    background: var(--beige);
}

.preview-body {
    min-height: 300px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
}

.preview-body img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
}

/* Action bar */
.action-bar {
    display: none;
    justify-content: center;
    margin-top: 15px;
}

.btn-process {
    padding: 11px 25px;
    border: 0;
    border-radius: 5px;
    background: var(--brown);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-process:hover:not(:disabled) {
    background: var(--brown-dark);
}

.btn-process:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.spinner-inline {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

.btn-process.loading .spinner-inline { display: inline-block; }
.btn-process.loading .btn-text { display: none; }
.btn-loading-text { display: none; }
.btn-process.loading .btn-loading-text { display: inline; }

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Progress bar */
.progress-wrap {
    display: none;
    margin-top: 15px;
}

.progress-bar-outer {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
}

.progress-bar-inner {
    height: 100%;
    width: 0%;
    background: var(--brown);
    border-radius: 4px;
    transition: width .3s ease;
}

.progress-text {
    margin-top: 6px;
    font-size: 12px;
    color: var(--brown-light);
    text-align: center;
}

/* Error banner */
#error-banner {
    display: none;
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #c99b8a;
    border-radius: 5px;
    background: #f5dfd7;
    color: #7b2d20;
    text-align: center;
    font-size: 13px;
}

/* Result */
.result-section {
    display: none;
    margin-top: 20px;
}

.result-card {
    background: var(--beige-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.result-card .card-label {
    padding: 10px 15px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
}

.card-image {
    min-height: 300px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
}

.card-image img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
}

.result-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

.btn-download {
    padding: 11px 25px;
    border: 0;
    border-radius: 5px;
    background: var(--brown);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
}

.btn-download:hover {
    background: var(--brown-dark);
}

.btn-reset {
    padding: 11px 25px;
    border: 1px solid var(--brown-light);
    border-radius: 5px;
    background: transparent;
    color: var(--brown);
    font-size: 14px;
    cursor: pointer;
}

.btn-reset:hover {
    background: var(--beige);
}

@media (max-width: 600px) {
    .app { padding: 20px 12px; }
    #drop-zone { padding: 45px 18px; }
    .preview-body, .card-image { min-height: 240px; }
}
</style>
</head>
<body>

<div class="app">
    <main class="content">

        <!-- Upload Zone -->
        <div id="upload-section">
            <div id="drop-zone">
                <h2>Drop your image here</h2>
                <p class="hint">or click anywhere to browse</p>
                <div class="upload-actions">
                    <button class="btn-browse" type="button" id="browse-btn">Choose Image</button>
                </div>
            </div>
            <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp">
        </div>

        <!-- Upload Preview -->
        <div class="preview-section" id="preview-section">
            <div class="preview-container">
                <div class="preview-header">
                    <div class="file-details">
                        <h4 id="preview-filename">image.png</h4>
                    </div>
                    <button class="btn-change" id="change-btn" type="button">Change</button>
                </div>
                <div class="preview-body">
                    <img id="upload-preview-img" alt="Uploaded image preview">
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar" id="action-bar">
            <button class="btn-process" id="process-btn" type="button">
                <span class="btn-text">Remove Background</span>
                <span class="btn-loading-text">Removing background…</span>
                <span class="spinner-inline"></span>
            </button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
            <p class="progress-text" id="progress-text">Loading model...</p>
        </div>

        <!-- Error Banner -->
        <div id="error-banner"></div>

        <!-- Result Section -->
        <section class="result-section" id="result-section">
            <div class="result-card">
                <div class="card-label">Background Removed</div>
                <div class="card-image">
                    <img id="result-preview" alt="Background removed">
                </div>
            </div>
            <div class="result-actions">
                <a class="btn-download" id="download-btn" href="#" download="bg_removed.png">Download PNG</a>
                <button class="btn-reset" id="reset-btn" type="button">Try Another</button>
            </div>
        </section>

    </main>
</div>

<script type="module">
    import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const browseBtn      = document.getElementById('browse-btn');
    const previewSection = document.getElementById('preview-section');
    const uploadSection  = document.getElementById('upload-section');
    const previewImg     = document.getElementById('upload-preview-img');
    const previewName    = document.getElementById('preview-filename');
    const changeBtn      = document.getElementById('change-btn');
    const actionBar      = document.getElementById('action-bar');
    const processBtn     = document.getElementById('process-btn');
    const errorBanner    = document.getElementById('error-banner');
    const resultSection  = document.getElementById('result-section');
    const resultPrev     = document.getElementById('result-preview');
    const downloadBtn    = document.getElementById('download-btn');
    const resetBtn       = document.getElementById('reset-btn');
    const progressWrap   = document.getElementById('progress-wrap');
    const progressBar    = document.getElementById('progress-bar');
    const progressText   = document.getElementById('progress-text');

    let selectedFile = null;

    function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
    }
    function hideError() {
        errorBanner.style.display = 'none';
    }

    // Drag & Drop
    ['dragenter', 'dragover'].forEach(e =>
        dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(e =>
        dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); })
    );
    dropZone.addEventListener('drop', ev => {
        if (ev.dataTransfer.files.length) handleFile(ev.dataTransfer.files[0]);
    });

    // Browse
    browseBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        hideError();
        uploadSection.style.display = 'none';
        previewSection.style.display = 'block';
        actionBar.style.display = 'flex';
        resultSection.style.display = 'none';
        progressWrap.style.display = 'none';
        previewName.textContent = file.name;

        const reader = new FileReader();
        reader.onload = e => { previewImg.src = e.target.result; };
        reader.readAsDataURL(file);
    }

    changeBtn.addEventListener('click', () => { resetUI(); fileInput.click(); });

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        processBtn.disabled = true;
        processBtn.classList.add('loading');
        hideError();
        resultSection.style.display = 'none';

        // Show progress bar
        progressWrap.style.display = 'block';
        progressBar.style.width = '0%';
        progressText.textContent = 'Loading model… (first time may take 30-60s)';

        try {
            const blob = await removeBackground(selectedFile, {
                progress: (key, current, total) => {
                    if (total > 0) {
                        const pct = Math.round((current / total) * 100);
                        progressBar.style.width = pct + '%';
                        if (key.includes('download')) {
                            progressText.textContent = `Downloading model… ${pct}%`;
                        } else {
                            progressText.textContent = `Processing… ${pct}%`;
                        }
                    }
                }
            });

            const url = URL.createObjectURL(blob);
            resultPrev.src = url;
            downloadBtn.href = url;
            resultSection.style.display = 'block';
            actionBar.style.display = 'none';
            progressWrap.style.display = 'none';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
            showError('Processing failed: ' + err.message);
            progressWrap.style.display = 'none';
        } finally {
            processBtn.disabled = false;
            processBtn.classList.remove('loading');
        }
    });

    resetBtn.addEventListener('click', resetUI);

    function resetUI() {
        selectedFile = null;
        fileInput.value = '';
        uploadSection.style.display = 'block';
        previewSection.style.display = 'none';
        actionBar.style.display = 'none';
        resultSection.style.display = 'none';
        progressWrap.style.display = 'none';
        hideError();
        previewImg.src = '';
        resultPrev.src = '';
    }
</script>
</body>
</html>

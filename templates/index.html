<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background Remover</title>
    <meta name="description" content="Simple image background remover.">
<style>
* { box-sizing: border-box; }

:root {
    --beige: #efe2cf;
    --beige-light: #f8f1e7;
    --brown: #6f4e37;
    --brown-dark: #4e3524;
    --brown-light: #9a7657;
    --border: #d2bda4;
    --white: #fffaf3;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--beige);
    color: var(--brown-dark);
    min-height: 100vh;
}

.app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
}

.content {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 0;
}

.navbar,
.hero {
    display: none !important;
}

/* Upload box */
#drop-zone {
    background: var(--beige-light);
    border: 2px dashed var(--brown-light);
    border-radius: 8px;
    padding: 55px 25px;
    text-align: center;
    cursor: pointer;
    transition: .2s ease;
}

#drop-zone:hover,
#drop-zone.dragover {
    border-color: var(--brown);
    background: var(--white);
}

.upload-ring {
    display: none;
}

#drop-zone h2 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
    color: var(--brown-dark);
}

#drop-zone .hint {
    margin: 0 0 20px;
    font-size: 14px;
    color: var(--brown-light);
}

.upload-actions {
    display: flex;
    justify-content: center;
}

.btn-browse {
    padding: 10px 22px;
    border: 0;
    border-radius: 5px;
    background: var(--brown);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}

.btn-browse:hover {
    background: var(--brown-dark);
}

.or-text,
.formats {
    display: none;
}

#file-input {
    display: none;
}

/* Preview */
.preview-section {
    display: none;
    margin-top: 20px;
}

.preview-container {
    background: var(--beige-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    border-bottom: 1px solid var(--border);
}

.file-info {
    display: flex;
    align-items: center;
}

.file-icon,
.file-details span {
    display: none;
}

.file-details h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
}

.btn-change {
    padding: 6px 12px;
    border: 1px solid var(--brown-light);
    border-radius: 4px;
    background: transparent;
    color: var(--brown);
    cursor: pointer;
}

.btn-change:hover {
    background: var(--beige);
}

.preview-body {
    min-height: 300px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
}

.preview-body img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
}

/* Process / download */
.action-bar,
.result-actions {
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

.btn-process,
.btn-download {
    padding: 11px 25px;
    border: 0;
    border-radius: 5px;
    background: var(--brown);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
}

.btn-process:hover,
.btn-download:hover {
    background: var(--brown-dark);
}

.btn-process:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.spinner-inline {
    display: none;
}

.btn-process.loading .spinner-inline {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-left: 6px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

.btn-process.loading .btn-text {
    display: none;
}

.btn-loading-text {
    display: none;
}

.btn-process.loading .btn-loading-text {
    display: inline;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#error-banner {
    display: none;
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #c99b8a;
    border-radius: 5px;
    background: #f5dfd7;
    color: #7b2d20;
    text-align: center;
    font-size: 13px;
}

/* Result: only the processed preview + download */
.result-section {
    display: none;
    margin-top: 20px;
}

.result-header,
.compare-card:first-child {
    display: none;
}

.compare-grid {
    display: block;
}

.compare-card.result-card {
    background: var(--beige-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.compare-card.result-card .card-label {
    padding: 10px 15px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
}

.label-dot {
    display: none;
}

.card-image {
    min-height: 300px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
}

.compare-card img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
}

.btn-reset {
    display: none;
}

@media (max-width: 600px) {
    .app {
        padding: 20px 12px;
    }

    #drop-zone {
        padding: 45px 18px;
    }

    .preview-body,
    .card-image {
        min-height: 240px;
    }
}
</style>
</head>
<body>

<div class="app">
<!-- Main Content -->
    <main class="content" id="main-content">

        <!-- Upload Zone -->
        <div class="upload-section" id="upload-section">
            <div id="drop-zone">
                <div class="upload-ring">
                    <span class="upload-emoji">📸</span>
                </div>
                <h2>Drop your image here</h2>
                <p class="hint">or click anywhere to browse</p>
                <div class="upload-actions">
                    <button class="btn-browse" type="button" id="browse-btn">Choose Image</button>
                    <span class="or-text">or drag & drop</span>
                </div>
                <div class="formats">
                    <span class="format-tag">PNG</span>
                    <span class="format-tag">JPG</span>
                    <span class="format-tag">JPEG</span>
                    <span class="format-tag">WEBP</span>
                    <span class="format-tag">BMP</span>
                    <span class="format-tag">≤ 16 MB</span>
                </div>
            </div>
            <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp">
        </div>

        <!-- Upload Preview -->
        <div class="preview-section" id="preview-section">
            <div class="preview-container">
                <div class="preview-header">
                    <div class="file-info">
                        <div class="file-icon">🖼️</div>
                        <div class="file-details">
                            <h4 id="preview-filename">image.png</h4>
                            <span id="preview-filesize">2.3 MB</span>
                        </div>
                    </div>
                    <button class="btn-change" id="change-btn" type="button">Change</button>
                </div>
                <div class="preview-body">
                    <img id="upload-preview-img" alt="Uploaded image preview">
                </div>
            </div>
        </div>
        <div class="action-bar" id="action-bar" style="display:flex;"><button class="btn-process" id="process-btn" type="button"><span class="btn-text">Remove Background</span><span class="btn-loading-text">Removing background…</span><span class="spinner-inline"></span></button></div>
<!-- Error Banner -->
        <div id="error-banner"></div>

        <!-- Result Section -->
        <section class="result-section" id="result-section">
            <div class="result-header">
                <div class="success-badge">
                    <span>✓</span>
                    Background removed successfully
                </div>
                <h2>Before & After</h2>
            </div>

            <div class="compare-grid">
                <div class="compare-card">
                    <div class="card-label">
                        <span class="label-dot original"></span>
                        Original
                    </div>
                    <div class="card-image">
                        <img id="original-preview" alt="Original image">
                    </div>
                </div>
                <div class="compare-card result-card">
                    <div class="card-label">
                        <span class="label-dot processed"></span>
                        Background Removed
                    </div>
                    <div class="card-image">
                        <img id="result-preview" alt="Background removed">
                    </div>
                </div>
            </div>

            <div class="result-actions">
                <a class="btn-download" id="download-btn" href="#">
                    <span>⬇</span>
                    Download PNG
                </a>
                <button class="btn-reset" id="reset-btn" type="button">
                    ↻ Try Another Image
                </button>
            </div>
        </section>

    </main>

</div>

<script>
    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const browseBtn      = document.getElementById('browse-btn');
    const previewSection = document.getElementById('preview-section');
    const uploadSection  = document.getElementById('upload-section');
    const previewImg     = document.getElementById('upload-preview-img');
    const previewName    = document.getElementById('preview-filename');
    const previewSize    = document.getElementById('preview-filesize');
    const changeBtn      = document.getElementById('change-btn');
    const actionBar      = document.getElementById('action-bar');
    const processBtn     = document.getElementById('process-btn');
    const errorBanner    = document.getElementById('error-banner');
    const resultSection  = document.getElementById('result-section');
    const originalPrev   = document.getElementById('original-preview');
    const resultPrev     = document.getElementById('result-preview');
    const downloadBtn    = document.getElementById('download-btn');
    const resetBtn       = document.getElementById('reset-btn');

    let selectedFile = null;

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
    }
    function hideError() {
        errorBanner.style.display = 'none';
    }

    // Drag & Drop
    ['dragenter', 'dragover'].forEach(e =>
        dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(e =>
        dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); })
    );
    dropZone.addEventListener('drop', ev => {
        if (ev.dataTransfer.files.length) handleFile(ev.dataTransfer.files[0]);
    });

    // Browse
    browseBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        hideError();
        uploadSection.style.display = 'none';
        previewSection.style.display = 'block';
        actionBar.style.display = 'flex';
        resultSection.style.display = 'none';
        previewName.textContent = file.name;
        previewSize.textContent = formatSize(file.size);

        const reader = new FileReader();
        reader.onload = e => {
            previewImg.src = e.target.result;
            originalPrev.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    changeBtn.addEventListener('click', () => { resetUI(); fileInput.click(); });

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        processBtn.disabled = true;
        processBtn.classList.add('loading');
        hideError();
        resultSection.style.display = 'none';

        const formData = new FormData();
        formData.append('image', selectedFile);

        try {
            const res = await fetch('/remove-bg', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || 'Unknown error');

            resultPrev.src = `/preview/${data.filename}`;
            downloadBtn.href = `/download/${data.filename}`;
            resultSection.style.display = 'block';
            actionBar.style.display = 'none';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
            showError(err.message);
        } finally {
            processBtn.disabled = false;
            processBtn.classList.remove('loading');
        }
    });

    resetBtn.addEventListener('click', resetUI);

    function resetUI() {
        selectedFile = null;
        fileInput.value = '';
        uploadSection.style.display = 'block';
        previewSection.style.display = 'none';
        actionBar.style.display = 'none';
        resultSection.style.display = 'none';
        hideError();
        previewImg.src = '';
        originalPrev.src = '';
        resultPrev.src = '';
    }
</script>
</body>
</html>
